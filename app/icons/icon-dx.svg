<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Mato mate DX app icon, background layer: the glowing tray. The characters (icons/dx/*.webp) are
       composited on top by scripts/make-icons.mjs, then icon-dx-badge.svg. Full-bleed (the OS applies the mask). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2f6e"/>
      <stop offset="1" stop-color="#050c1c"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trayFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4388"/>
      <stop offset="1" stop-color="#0c2146"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g stroke="#45e5ff" stroke-opacity="0.08" stroke-width="3">
    <path d="M0 820H1024M0 900H1024M0 980H1024"/>
    <path d="M512 760L512 1024M352 760L232 1024M672 760L792 1024M192 760L-8 1024M832 760L1032 1024"/>
  </g>
  <ellipse cx="512" cy="560" rx="470" ry="380" fill="url(#halo)"/>

  <!-- tray, wider than the single-play icon's: the whole team stands in it -->
  <g filter="url(#soft)">
    <rect x="150" y="640" width="724" height="130" rx="40" fill="#163a78"/>
    <path d="M110 720 H914 a44 44 0 0 1 44 44 V846 a70 70 0 0 1 -70 70 H136 a70 70 0 0 1 -70 -70 V764 a44 44 0 0 1 44 -44 Z" fill="url(#trayFace)" stroke="#45e5ff" stroke-width="10"/>
  </g>
  <rect x="392" y="846" width="240" height="22" rx="11" fill="#45e5ff" filter="url(#glow)"/>
</svg>
